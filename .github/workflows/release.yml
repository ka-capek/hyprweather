# Sestaví balíčky pro Linux a přiloží je k vydání na GitHubu.
#
#   git tag v0.1.0 && git push origin v0.1.0    → vydání s AppImage a .pacman
#   ruční spuštění (workflow_dispatch)          → jen artefakt běhu, bez vydání
#
# Verze v tagu musí sedět s `version` v package.json, jinak sestavení skončí.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            WeatherAnimationLab/package-lock.json

      # Electron a jeho nástroje jsou stovky MB a mezi vydáními se nemění.
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      # fpm staví .MTREE pacman balíčku přes bsdtar, který na runneru není.
      - name: bsdtar pro pacman balíček
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - run: npm ci

      - name: Tests
        run: node --test tests/*.cjs

      - name: Tag odpovídá verzi v package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME neodpovídá package.json ($pkg)." >&2
            exit 1
          fi

      # --publish never: vydání zakládá až krok níž přes gh, ne electron-builder.
      - name: Build
        run: npm run dist -- --publish never

      - name: Kontrolní součty
        run: |
          cd release
          sha256sum *.AppImage *.pacman | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hyprweather-linux-x64
          path: |
            release/*.AppImage
            release/*.pacman
            release/SHA256SUMS.txt
          retention-days: 14

      - name: Vydání na GitHubu
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Vydání vzniká prázdné a soubory se přidávají zvlášť. Když `gh release
          # create` nahrává soubory rovnou a jeden upload selže, smaže celé vydání
          # — a upload stopadesátimegového AppImage občas skončí HTTP 500.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --title "Weather ${GITHUB_REF_NAME#v}" \
              --generate-notes

          status=0
          for file in release/*.AppImage release/*.pacman release/SHA256SUMS.txt; do
            uploaded=0
            for try in 1 2 3; do
              if gh release upload "$GITHUB_REF_NAME" "$file" --clobber; then
                uploaded=1
                break
              fi
              echo "Upload $file selhal (pokus $try), zkouším znovu." >&2
              sleep $((try * 20))
            done
            if [ "$uploaded" != 1 ]; then
              echo "::error::$file se nepodařilo nahrát"
              status=1
            fi
          done
          exit $status
