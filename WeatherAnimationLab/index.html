<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:">
  <title>Atmosphere · Animation Lab</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-fog" viewBox="0 0 40 40"><path d="M10 23a6 6 0 0 1-1-12 9 9 0 0 1 17-2 7 7 0 0 1 4 14" fill="currentColor" opacity=".85"/><path d="M7 27h24M11 32h23M6 37h21" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="icon-wind" viewBox="0 0 40 40"><path d="M5 15h19c9 0 9-12 2-12-3 0-5 2-5 4M3 21h29c7 0 7-9 2-9M7 27h15c8 0 8 10 2 10-3 0-4-2-4-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
  </defs></svg>
  <div id="scene"></div>
  <div class="vignette"></div>
  <div id="loading"><span class="loading-sun"></span><p>Painting the sky</p><small>Loading the atmosphere and cloud volumes</small></div>
  <header class="lab-header chrome"><span>ATMOSPHERE <i>/</i> MOTION STUDIES</span><div><span id="fps">—</span><button id="close" title="Close window">×</button></div></header>
  <main id="weather" class="hidden" aria-label="Sample weather overlay">
    <p class="place">Prague</p><p class="sample">SAMPLE WEATHER</p>
    <svg id="condition-icon" class="weather-icon hidden" aria-hidden="true"><use id="condition-icon-use" href="#icon-fog"/></svg>
    <p id="temperature">21°</p><p id="condition">Partly cloudy</p>
    <p class="range">H:23° &nbsp; · &nbsp; L:14°</p>
  </main>
  <section class="dock chrome" aria-label="Animation laboratory controls">
    <div class="study-heading"><div><span id="eyebrow">STUDY 01</span><h1 id="title">The last light</h1></div><button id="overlay" class="quiet" aria-pressed="false">Weather overlay <kbd>U</kbd></button></div>
    <nav id="presets" aria-label="Select a development scene">
      <button data-scene="sunset" class="active"><span class="swatch sunset"></span><span>Sunset<small>01 · Golden clouds</small></span></button>
      <button data-scene="sunrise"><span class="swatch sunrise"></span><span>Sunrise<small>02 · First light</small></span></button>
      <button data-scene="storm"><span class="swatch storm"></span><span>Thunderstorm<small>03 · After dark</small></span></button>
      <button data-scene="snow"><span class="swatch snow"></span><span>Light snow<small>04 · Sunlit flakes</small></span></button>
      <button data-scene="fog"><svg class="study-icon" aria-hidden="true"><use href="#icon-fog"/></svg><span>Fog<small>05 · Soft veils</small></span></button>
      <button data-scene="wind"><svg class="study-icon" aria-hidden="true"><use href="#icon-wind"/></svg><span>Strong wind<small>06 · Passing fronts</small></span></button>
      <button data-scene="blizzard"><span class="swatch blizzard"></span><span>Heavy snow<small>07 · Low visibility</small></span></button>
      <button data-scene="night"><span class="swatch night"></span><span>Starry night<small>08 · Moon glow</small></span></button>
      <button data-scene="cloudy-night"><span class="swatch cloudy-night"></span><span>Cloudy night<small>09 · Hidden stars</small></span></button>
    </nav>
    <div class="controls">
      <label>Light / time <output id="sun-value">1.5°</output><input id="sun" type="range" min="-14" max="35" step="0.1" value="1.5"></label>
      <label>Cloud cover <output id="cloud-value">42%</output><input id="clouds" type="range" min="0" max="1" step="0.01" value="0.42"></label>
      <button id="framing" class="quiet" aria-pressed="true" title="Compare composition (V)">View: layered</button>
      <button id="cycle" class="quiet" aria-pressed="false">Play sunset</button>
      <button id="pause" class="quiet" aria-pressed="false">Pause</button>
    </div>
    <footer><span>Live sky · No weather data · No sound</span><span><kbd>1–9</kbd> scenes &nbsp; <kbd>V</kbd> view &nbsp; <kbd>H</kbd> hide controls &nbsp; <kbd>Space</kbd> pause</span></footer>
  </section>
  <script type="module" src="./app.js"></script>
</body>
</html>
